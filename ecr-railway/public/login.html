<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · ECR</title>}
 
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; background: #16161a;
  }
  .card {
    background: #fff; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.3rem; margin: 0 0 1.5rem; color: #16161a; text-align: center; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #444; }
  input {
    width: 100%; padding: 0.7rem; margin-bottom: 1rem; border: 1px solid #e2ddd2;
    border-radius: 6px; font-size: 1rem;
  }
  button {
    width: 100%; padding: 0.8rem; background: #b08d3c; color: #fff; border: none;
    border-radius: 6px; font-size: 1rem; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .error {
    background: #fdecea; color: #c0392b; padding: 0.6rem; border-radius: 6px;
    font-size: 0.85rem; margin-bottom: 1rem; display: none;
  }
   .password-wrap { position: relative; }
  .password-wrap input { padding-right: 2.5rem; }
     #togglePassword {
    position: absolute; right: 0.6rem; top: 0; bottom: 0; margin: auto 0;
    display: flex; align-items: center; justify-content: center;
    width: 2rem; height: 100%; padding: 0; padding-bottom: 10px; background: none; border: none;
    cursor: pointer;
  }
  }
  #togglePassword:hover { opacity: 0.6; }
   #togglePassword:hover { opacity: 0.6; }
  #eyeIcon { position: relative; top: -4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>ECR · Estudio Casil Rodríguez</h1>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>
          <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input type="password" id="password" required>
               <button type="button" id="togglePassword" aria-label="Mostrar contraseña"><svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16161a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <button type="submit">Ingresar</button>
    </form>
       <a href="/recuperar.html" style="display:block; text-align:center; margin-top:1rem; font-size:0.85rem; color:#666; text-decoration:none;">¿Olvidaste tu contraseña?</a>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');
   const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
       const eyeIcon = document.getElementById('eyeIcon');
  const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
  const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  toggleBtn.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'No se pudo iniciar sesión';
        errorBox.style.display = 'block';
        return;
      }
      localStorage.setItem('ecr_token', data.token);
      localStorage.setItem('ecr_usuario', JSON.stringify(data.usuario));
      window.location.href = '/index.html';
    } catch (err) {
      errorBox.textContent = 'Error de conexión con el servidor';
      errorBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
