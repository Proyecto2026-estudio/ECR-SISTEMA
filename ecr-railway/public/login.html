<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · ECR</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; background: #16161a;
  }
  .card {
    background: #fff; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.3rem; margin: 0 0 1.5rem; color: #16161a; text-align: center; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #444; }
  input {
    width: 100%; padding: 0.7rem; margin-bottom: 1rem; border: 1px solid #e2ddd2;
    border-radius: 6px; font-size: 1rem;
  }
  button {
    width: 100%; padding: 0.8rem; background: #b08d3c; color: #fff; border: none;
    border-radius: 6px; font-size: 1rem; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .error {
    background: #fdecea; color: #c0392b; padding: 0.6rem; border-radius: 6px;
    font-size: 0.85rem; margin-bottom: 1rem; display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>ECR · Estudio Casil Rodríguez</h1>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'No se pudo iniciar sesión';
        errorBox.style.display = 'block';
        return;
      }
      localStorage.setItem('ecr_token', data.token);
      localStorage.setItem('ecr_usuario', JSON.stringify(data.usuario));
      window.location.href = '/index.html';
    } catch (err) {
      errorBox.textContent = 'Error de conexión con el servidor';
      errorBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
